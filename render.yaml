services:
  - type: web
    name: breathe-esg
    plan: free
    env: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build && cd ../backend && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"